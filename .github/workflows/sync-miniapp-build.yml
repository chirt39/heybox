name: Build website and Heybox miniapp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install website dependencies
        run: npm ci
      - name: Install miniapp dependencies
        run: npm ci --prefix miniapp
      - name: Build website
        run: npm run build
      - name: Build miniapp from the same commit
        run: npm run build:miniapp
      - name: Save website build
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: dist/
      - name: Save miniapp build
        uses: actions/upload-artifact@v4
        with:
          name: heybox-miniapp-${{ github.sha }}
          path: miniapp/dist/
